name: Android builds and runtime artifacts

on:
  push:
    branches: [main, 'copilot/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_providers:
        description: 'Perform small, billable NVIDIA and Hugging Face inference checks (main only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Android and gateway checks
    uses: ./.github/workflows/android.yml

  gateway-runtime:
    name: Prepare gateway runtime
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate trusted runtime credential injection
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GATEWAY_ACCESS_TOKEN: ${{ secrets.GATEWAY_ACCESS_TOKEN }}
        run: python gateway/check_configuration.py
      - name: Verify live providers (explicit opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_providers && github.ref == 'refs/heads/main'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GATEWAY_ACCESS_TOKEN: ${{ secrets.GATEWAY_ACCESS_TOKEN }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          HF_MODEL: ${{ vars.HF_MODEL }}
        run: python gateway/verify_providers.py
      - name: Package public runtime code and non-secret configuration
        env:
          NEMOTRON_GATEWAY_URL: ${{ vars.NEMOTRON_GATEWAY_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          HF_MODEL: ${{ vars.HF_MODEL }}
        run: |
          python scripts/build_runtime_bundle.py
          cd dist/gateway-runtime
          sha256sum quantsense-gateway-runtime.tar.gz > quantsense-gateway-runtime.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: quantsense-gateway-runtime-${{ github.sha }}
          path: |
            dist/gateway-runtime/*.tar.gz
            dist/gateway-runtime/*.sha256
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release APKs
    runs-on: ubuntu-latest
    needs: [test, gateway-runtime]
    outputs:
      release_version_name: ${{ steps.version.outputs.release_version_name }}
      release_version_code: ${{ steps.version.outputs.release_version_code }}
      release_artifact_name: ${{ steps.version.outputs.release_artifact_name }}
      docker_version_tag: ${{ steps.version.outputs.docker_version_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: quantsense-gateway-runtime-${{ github.sha }}
          path: dist/gateway-runtime
      - name: Configure APK from validated runtime artifact
        run: python scripts/configure_ci_build.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;35.0.0"
      - name: Prepare optional release signing credentials
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/prepare_signing.py
      - name: Resolve build version metadata
        id: version
        run: python scripts/resolve_build_version.py
      - name: Assemble release APKs
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Pstocksense.versionName="$RELEASE_VERSION_NAME" \
            -Pstocksense.versionCode="$RELEASE_VERSION_CODE"
      - name: Verify packaged runtime model
        run: python scripts/verify_apk_runtime.py
      - name: Rename APKs
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.release_version_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          for apk in Path('app/build/outputs/apk/release').glob('*.apk'):
              match = re.fullmatch(r'app-(.+)-release(?:-unsigned)?\.apk', apk.name)
              if not match:
                  raise SystemExit('Unexpected APK filename')
              apk.rename(apk.with_name(f"quantsense-{os.environ['RELEASE_VERSION_NAME']}-{match[1]}.apk"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.release_artifact_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f keystore.jks keystore.properties

  docker:
    name: Publish APK and runtime download image
    runs-on: ubuntu-latest
    needs: [assemble, gateway-runtime]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.assemble.outputs.release_artifact_name }}
          path: app/build/outputs/apk/release
      - uses: actions/download-artifact@v4
        with:
          name: quantsense-gateway-runtime-${{ github.sha }}
          path: dist/gateway-runtime
      - name: Log in to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$CR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push download image
        env:
          VERSION_TAG: ${{ needs.assemble.outputs.docker_version_tag }}
        run: |
          IMAGE_ID="$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE_ID:latest" -t "$IMAGE_ID:$GITHUB_SHA" -t "$IMAGE_ID:$VERSION_TAG" .
          python scripts/smoke_download_image.py --image "$IMAGE_ID:$GITHUB_SHA"
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:$GITHUB_SHA"
          docker push "$IMAGE_ID:$VERSION_TAG"

  publish-release:
    name: Publish release APKs and gateway runtime
    runs-on: ubuntu-latest
    needs: [assemble, gateway-runtime]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.assemble.outputs.release_artifact_name }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: quantsense-gateway-runtime-${{ github.sha }}
          path: runtime
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            runtime/*.tar.gz
            runtime/*.sha256
          tag_name: ${{ github.ref_name }}
          name: Release v${{ needs.assemble.outputs.release_version_name }}
          fail_on_unmatched_files: true
