name: QuantSense checks

on:
  workflow_call:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APKs
    runs-on: ubuntu-latest
    env:
      NEMOTRON_GATEWAY_URL: ${{ vars.NEMOTRON_GATEWAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test gateway routing and runtime artifact isolation
        run: |
          python -m unittest discover -s gateway -v
          python -m unittest discover -s scripts -v
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;35.0.0"
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: quantsense-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantsense-test-results-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.html
          retention-days: 7
